<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visualização com D3.js</title>
    <link rel="stylesheet" href="css/estilo.css">
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <script src="./scripts/scripts.js"></script>
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>

<body>
    <header>
        <h1>Dashboard de Dados Estático</h1>
        <p>Exemplo prático utilizando D3.js</p>
    </header>

    <nav id="top-menu">
        <div class="logo">Genealogia v1.0</div>
        <div class="search-container">
            <input type="text" id="search-input" placeholder="Buscar antepassado...">
            <div id="search-results"></div>
        </div>
    </nav>

    <main id="app-container">
        <div id="tree-canvas"></div>

        <aside id="info-panel">
            <button class="close-btn">&times;</button>
            <div class="panel-content">
            <img id="person-photo" src="" alt="Foto">
            <h2 id="person-name">Nome do Familiar</h2>
            <p><strong>Nascimento:</strong> <span id="person-birth"></span></p>
            <p><strong>Bio:</strong> <span id="person-bio"></span></p>
            </div>
        </aside>
    </main>

    <!--<main>
        <div id="tree-container"></div>

<script>
var treeData; // Armazena os dados originais
var boxWidth = 150,
    boxHeight = 40;

const container = d3.select("#tree-canvas");
const width = container.node().getBoundingClientRect().width;
const height = container.node().getBoundingClientRect().height;

// 1. Configuração de Zoom e Pan
const zoom = d3.zoom()
    .scaleExtent([0.1, 1])
    .on('zoom', (event) => {
        // Na v7 usamos event.transform
        g.attr("transform", event.transform);
    });

const svg = container.append("svg")
    .attr('width', '100%')
    .attr('height', '100%')
    .call(zoom);

/*const svg = d3.select("body").append("svg")
    .attr('width', 1000)
    .attr('height', 500)
    .call(zoom);*/

// Grupo principal que sofrerá o zoom/pan
const g = svg.append('g');

// Centralizar a árvore inicialmente
const initialTransform = d3.zoomIdentity.translate(width / 2, height / 2).scale(0.8);
svg.call(zoom.transform, initialTransform);

// Aplicar transformação inicial para evitar o "pulo" no primeiro clique
//const initialTransform = d3.zoomIdentity.translate(150, 200);
//svg.call(zoom.transform, initialTransform);
//svg.call(zoom.transform, d3.zoomIdentity.translate(width/2, height/2).scale(0.8));

// 2. Definição do Layout da Árvore
const treeLayout = d3.tree()
    .nodeSize([boxWidth + 20, 150]) // Espaçamento horizontal e vertical entre gerações
    .separation(() => 1);


d3.json('data/familiaxavier.json').then(rawGedcom => {
    
    // Converte a estrutura flat do GEDCOM para a árvore recursiva
    // "I1" seria o seu ID ou de quem você quer começar a árvore
    //const hierarchicalData = convertGedcomToD3Bidirectional(rawGedcom, "@I0026@");
    const hierarchicalData = convertGedcomToD3(rawGedcom, "@I0026@");

    // Agora usa os dados convertidos no seu código D3 v7
    treeData = hierarchicalData;
    draw();
});
// 3. Carregamento dos Dados (Fetch/Promise na v7)

function showDetails(data) {
    // Preenche os campos do aside
    $('#person-name').text(data.name);
    $('#person-birth').text(data.birth || "Data não disponível");
    $('#person-bio').text(data.notes || "Sem biografia cadastrada.");
    
    // Mostra o painel adicionando a classe active
    $('#info-panel').addClass('active');

    // Opcional: Destaque visual no nó clicado
    d3.selectAll(".person").classed("selected", false);
    d3.select(`[data-id="${data.id}"]`).classed("selected", true);
}

// Evento para fechar o painel (jQuery)
$('.close-btn').click(function() {
    $('#info-panel').removeClass('active');
});

const duration = 750;

function draw() {
    const root = d3.hierarchy(treeData, d => {
        let connections = [];
        if (!d.parentsCollapsed && d._parents) connections = connections.concat(d._parents);
        if (!d.childrenCollapsed && d._children) connections = connections.concat(d._children);
        return connections;
    });

    treeLayout(root);
    const nodes = root.descendants();
    const links = root.links();

    // --- SELEÇÃO DE NÓS ---
    const node = g.selectAll("g.person")
        .data(nodes, d => d.data.id);

    // ENTER: Ponto de partida (nascendo do pai)
    const nodeEnter = node.enter().append("g")
        .attr("class", "person")
        .attr("data-id", d => d.data.id)
        .attr("transform", d => {
            const p = d.parent || {x: d.x, y: d.y};
            const yPos = d.data.isAncestor ? -p.y : p.y;
            return `translate(${p.x},${yPos}) scale(0.1)`; // Começa bem pequeno
        })
        .style("opacity", 0)
        .on('click', (event, d) => {
            // Se clicar no nó (não nos botões), abre detalhes
            showDetails(d.data);
        });
        //.on('click', (event, d) => togglePerson(d.data));

    // Caixa de pessoas
    nodeEnter.filter(d => d.data.type === 'person')
        .append("rect")
            .attr("x", -(boxWidth / 2))
            .attr("y", -(boxHeight / 2))
            .attr("width", boxWidth)
            .attr("height", boxHeight)
            .attr("rx", 5); // Cantos arredondados para um visual moderno

    nodeEnter.filter(d => d.data.type === 'union')
        .append("circle")
        .attr("r", 10)
        .style("fill", "pink");

    nodeEnter.append("text")
        .attr("text-anchor", "middle")
        .attr("dy", 5)
        .text(d => d.data.first_name);


    // 1. Botão SUPERIOR (Ancestrais/Pais)
    nodeEnter.append("circle")
        .attr("cy", -(boxHeight / 2))
        .attr("r", 8)
        .style("fill", d => d.data._parents && d.data._parents.length > 0 ? "#4e73df" : "#ccc")
        .on("click", (event, d) => {
            if (d.data._parents.length > 0) {
                event.stopPropagation();
                d.data.parentsCollapsed = !d.data.parentsCollapsed;
                draw();
            }
        });
    
    nodeEnter.append("text")
        .attr("class", "btn-icon")
        .attr("y", -(boxHeight / 2) + 4)
        .attr("text-anchor", "middle")
        .style("fill", "white")
        .style("font-size", "10px")
        .style("pointer-events", "none")
        .text("▲");

    // 2. Botão INFERIOR (Descendentes/Filhos)
    nodeEnter.append("circle")
        .attr("cy", (boxHeight / 2))
        .attr("r", 8)
        .style("fill", d => d.data._children && d.data._children.length > 0 ? "#1cc88a" : "#ccc")
        .on("click", (event, d) => {
            if (d.data._children.length > 0) {
                event.stopPropagation();
                d.data.childrenCollapsed = !d.data.childrenCollapsed;
                draw();
            }
        });

    nodeEnter.append("text")
        .attr("class", "btn-icon")
        .attr("y", (boxHeight / 2) + 4)
        .attr("text-anchor", "middle")
        .style("fill", "white")
        .style("font-size", "10px")
        .style("pointer-events", "none")
        .text("▼");
    
    // UPDATE: A mágica da transição com Easing
    const nodeUpdate = node.merge(nodeEnter);
    
    nodeUpdate.transition()
        .duration(duration)
        .ease(d3.easeBackOut.overshoot(1.2)) // 'overshoot' substituiu 'amplitude' no BackOut
        .attr("transform", d => {
            const yPos = d.data.isAncestor ? -d.y : d.y;
            return `translate(${d.x},${yPos}) scale(1)`;
        })
        .style("opacity", 1);

    /*nodeUpdate.transition()
        .duration(duration)
        .ease(d3.easeBackOut.amplitude(1.2)) // Efeito elástico
        .attr("transform", d => {
            const yPos = d.data.isAncestor ? -d.y : d.y;
            return `translate(${d.x},${yPos}) scale(1)`; // Ganha tamanho e posição
        })
        .style("opacity", 1);*/

    // EXIT: Encolhendo e voltando para o pai
    node.exit().transition()
        .duration(duration)
        .ease(d3.easeBackIn) // Efeito de "recolhida" antes de sumir
        .attr("transform", d => {
            const p = d.parent || {x: d.x, y: d.y};
            const yPos = d.data.isAncestor ? -p.y : p.y;
            return `translate(${p.x},${yPos}) scale(0.1)`;
        })
        .style("opacity", 0)
        .remove();

    // --- SELEÇÃO DE LINKS ---
    const link = g.selectAll("path.link")
        .data(links, d => d.target.data.id);

    const linkEnter = link.enter().insert("path", "g") // Insere atrás dos nós
        .attr("class", "link")
        .attr("d", d => {
            const p = d.source;
            const y = d.target.data.isAncestor ? -p.y : p.y;
            const sY = d.target.data.isAncestor ? y - (boxHeight/2) : y + (boxHeight/2);
            return `M${p.x},${sY} V${sY} H${p.x} V${sY}`;
        })
        .style("opacity", 0);

    link.merge(linkEnter).transition()
        .duration(duration)
        .attr("d", elbow)
        .style("opacity", 1);

    link.exit().transition()
        .duration(duration)
        .attr("d", d => {
            const p = d.source;
            const y = d.target.data.isAncestor ? -p.y : p.y;
            const sY = d.target.data.isAncestor ? y - (boxHeight/2) : y + (boxHeight/2);
            return `M${p.x},${sY} V${sY} H${p.x} V${sY}`;
        })
        .style("opacity", 0)
        .remove();

    $('#search-input').on('keypress', function(e) {
        if(e.which == 13) { // Tecla Enter
            const name = $(this).val().toLowerCase();
            // Procura no treeData
            const match = nodes.find(d => d.data.name.toLowerCase().includes(name));
            if(match) {
                // Move a câmera do D3 para o parente encontrado
                svg.transition().duration(750).call(
                    zoom.transform, 
                    d3.zoomIdentity.translate(width/2 - match.x, height/2 - match.y).scale(1)
                );
                showDetails(match.data);
            }
        }
    });
}

function toggleAncestors(person) {
    person.parentsCollapsed = !person.parentsCollapsed;
    draw();
}

function toggleDescendants(person) {
    person.childrenCollapsed = !person.childrenCollapsed;
    draw();
}

function togglePerson(person) {
    if (person.collapsed) {
        person.collapsed = false;
    } else {
        collapse(person);
    }
    draw();
}

function collapse(person) {
    person.collapsed = true;
    if (person._parents) {
        person._parents.forEach(collapse);
    }
}

function elbow(d) {
    const isUp = d.target.data.isAncestor;
    const isUnion = d.target.data.type === "union"; // Detecta se o destino é união
    
    // Coordenadas de origem e destino
    const sourceX = d.source.x;
    const sourceY = isUp ? -d.source.y : d.source.y;
    const targetX = d.target.x;
    const targetY = isUp ? -d.target.y : d.target.y;

    // Ponto de saída da origem (sempre uma caixa de pessoa)
    const sY = isUp ? sourceY - (boxHeight / 2) : sourceY + (boxHeight / 2);

    // Ponto de entrada no destino:
    // 1. Se for união, a linha vai até o centro exato (Y)
    // 2. Se for pessoa, a linha para na borda da caixa (boxHeight / 2)
    let tY;
    if (isUnion) {
        tY = targetY; 
    } else {
        tY = isUp ? targetY + (boxHeight / 2) : targetY - (boxHeight / 2);
    }

    // Retorna o caminho em formato "L" (Vertical -> Horizontal -> Vertical)
    return `M${sourceX},${sY}
            V${(sY + tY) / 2}
            H${targetX}
            V${tY}`;
}
